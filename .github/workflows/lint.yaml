name: Lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Documentation Repo
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: |
          npm install
          pip install -r ./requirements.txt
          dotnet tool restore
      - name: Run linters
        run: |
          pre-commit run --all-files
          npm run lint
      # The linters don't resolve cross-references, so a broken :doc: link only
      # surfaces in a real build. Matches Read the Docs' fail_on_warning.
      - name: Build docs
        run: python -m sphinx -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html
